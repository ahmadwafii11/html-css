<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar CSS-Dasar - Menambahkan File CSS (Internal)</title>
    
    <!--Cara 1) internal dengan menambahkan tag style untuk CSS-->
    <style>
        /* Menambahkan style di h1*/
        h1 {
            color: black;
            font-size: 20px;
        }

        /* Menambahkan style di h2*/
        h2 {
            color: yellow;
            font-size: 10px;
        }

        /* Menambahkan style di p*/
        p {
            color: blue;
            font-size: 5px;
        }

    </style>

</head>
<body>
    <h1><b>Belajar CSS-Dasar - Menambahkan File CSS (Internal)</b></h1>
    <h2>Pejuang CSS</h2>
    <p>Belajar CSS Dasar</p>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar HTML Form - Text Area Tag</title>
</head>
<body>
    <h1><b>Belajar HTML Form - Text Area Tag</b></h1>
    
    <!--Tag Form -->
    <form>

        <!--Tag label-->
        <label for="deskripsi">Deskripsi: </label><br>
        <!--Tag textarea untuk label deskripsi denfan cols=50 (untuk menentukan panjang input) dan rows=10 (untuk menentukan tinggi input)-->
        <textarea name="deskripsi" id="deskripsi" cols="50" rows="10">Ini teks deskripsi</textarea><br>
        <!--Tag input dengan type submit-->
        <input type="submit" value="Simpan">

    </form>
</body>
</html>

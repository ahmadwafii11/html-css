<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar HTML Form - Input Checkbox</title>
</head>
<body>
    <h1><b>Belajar HTML Form - Input Checkbox</b></h1>

    <form>
        <!--Isi dari tag form-->
        My Hobby: <br>

        <!--Tag input dengan type=checkbox id=coding (berbeda karena setiap value dari input hobby bisa berbeda) value=Coding name=hobby (kenapa namenya sama? karena input dari hobby bisa multiple, artinya lebih dari satu)-->
        <input type="checkbox" name="hobby" id="coding" value="Coding">
        <!--Tambahkan tag label untuk mempermudah pemilihan ceklisnya-->
        <label for="coding">Coding</label> <br>

        <!--Tag input dengan type=checkbox id=gaming (berbeda karena setiap value dari input hobby bisa berbeda) value=Gaming name=hobby (kenapa namenya sama? karena input dari hobby bisa multiple, artinya lebih dari satu-->
        <input type="checkbox" name="hobby" id="gaming" value="Gaming">
        <!--Tambahkan tag label untuk mempermudah pemilihan ceklisnya-->
        <label for="gaming">Gaming</label> <br>

        <!--Tag input dengan type=checkbox id=diving (berbeda karena setiap value dari input hobby bisa berbeda) value=Diving name=hobby (kenapa namenya sama? karena input dari hobby bisa multiple, artinya lebih dari satu-->
        <input type="checkbox" name="hobby" id="diving" value="Diving">
        <!--Tambahkan tag label untuk mempermudah pemilihan ceklisnya-->
        <label for="diving">Diving</label> <br>

        <input type="checkbox" name="hobby" id="menghina_liverpool" value="Menghina Liverpool">
        <label for="menghina_liverpool">Menghina Liverpool</label> <br>

        <!--Tag submit untuk menyimppan data inputan-->
        <input type="submit" value="Simpan">

    </form>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar HTML Form - Tag Input</title>
</head>
<body>
    <h1><b>Belajar HTML Form - Tag Input</b></h1>

    <!--Tag Form-->
    <form>
        <!--Isi dari tag form-->
        Pencarian: <br>

        <!--Tag Input dengan attributenya-->
        <input type="text" name="pencarian">
        
    </form>
</body>
</html>

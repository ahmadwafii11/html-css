<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar CSS-Layput - Flexbox Items (Flex-Grow)</title>
    <style>
        @import url(flex-grow.css);
    </style>
</head>
<body>
    
    <!--Tag h1-->
    <h1 id="judul"><b>Belajar CSS-Layout - Flexbox Items (Flex-Grow)</b></h1>
    
    <!--Tag div dengan class=container untuk membungkus semua tag div dengan class=content...-->
    <div class="container">
        <!--Tag div dengan class=content small-->
        <div class="content small">A</div>

        <!--Tag div dengan class=content large-->
        <div class="content large">B</div>

        <!--Tag div dengan class=content small-->
        <div class="content small">C</div>

        <!--Tag div dengan class=content large-->
        <div class="content large">D</div>

        <!--Tag div dengan class=content small-->
        <div class="content small">E</div>

    </div>
    

</body>
</html>
